<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reservas de laboratorios</title>
<style>body{font-family:Arial,sans-serif;background:#f2f6f8;color:#203344;margin:0}.wrap{max-width:1050px;margin:40px auto;padding:26px;background:white;border-radius:14px;box-shadow:0 8px 28px #15324b18}h1{color:#15324b}.btn,button{display:inline-block;padding:10px 14px;background:#137c8b;color:white;border:0;border-radius:6px;text-decoration:none;cursor:pointer}table{width:100%;border-collapse:collapse;margin-top:20px}th,td{text-align:left;padding:12px;border-bottom:1px solid #d7e1e5}th{background:#eaf3f5}.status{color:#137c8b;font-weight:bold}</style></head>
<body><main class="wrap"><h1>Reservas de laboratorios</h1><p>Consulte la agenda y gestione sus espacios académicos.</p>
<a class="btn" th:href="@{/reservas/nueva}">Solicitar laboratorio</a> <a class="btn" th:href="@{/evidencias/api.html}">Ver evidencia de API</a>
<table><thead><tr><th>Laboratorio</th><th>Solicitante</th><th>Correo</th><th>Inicio</th><th>Fin</th><th>Motivo</th><th>Estado</th><th>Acción</th></tr></thead><tbody>
<tr th:each="reserva : ${reservas}"><td th:text="${reserva.laboratorio.nombre}"></td><td th:text="${reserva.nombreSolicitante}"></td><td th:text="${reserva.correoSolicitante}"></td><td th:text="${#temporals.format(reserva.inicio, 'yyyy-MM-dd HH:mm')}"></td><td th:text="${#temporals.format(reserva.fin, 'yyyy-MM-dd HH:mm')}"></td><td th:text="${reserva.motivo}"></td><td class="status" th:text="${reserva.estado}"></td><td><form th:if="${reserva.estado.name() != 'CANCELADA'}" th:action="@{/reservas/{id}/cancelar(id=${reserva.id})}" method="post"><button type="submit">Cancelar</button></form></td></tr>
<tr th:if="${#lists.isEmpty(reservas)}"><td colspan="8">Aún no hay reservas.</td></tr></tbody></table></main></body></html>
