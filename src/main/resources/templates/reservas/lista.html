<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reservas de laboratorios</title>
<style>body{font-family:Arial,sans-serif;background:#f2f6f8;color:#203344;margin:0}.wrap{max-width:1000px;margin:40px auto;padding:24px;background:white;border-radius:12px;box-shadow:0 8px 28px #15324b18}h1{color:#15324b}.btn{display:inline-block;padding:10px 14px;background:#137c8b;color:white;border-radius:6px;text-decoration:none}table{width:100%;border-collapse:collapse;margin-top:20px}th,td{text-align:left;padding:12px;border-bottom:1px solid #d7e1e5}th{background:#eaf3f5}.error{padding:12px;background:#fde8e8;color:#8b2424}form{display:inline}</style></head>
<body><main class="wrap"><h1>Reservas de laboratorios</h1><p>Gestione los espacios académicos de ConfUDES.</p>
<p th:if="${error}" class="error" th:text="${error}"></p><a class="btn" th:href="@{/reservas/nueva}">Nueva reserva</a>
<table><thead><tr><th>Laboratorio</th><th>Solicitante</th><th>Inicio</th><th>Fin</th><th>Estado</th><th>Acción</th></tr></thead><tbody>
<tr th:each="reserva : ${reservas}"><td th:text="${reserva.laboratorio.nombre}"></td><td th:text="${reserva.solicitante}"></td><td th:text="${#temporals.format(reserva.inicio, 'yyyy-MM-dd HH:mm')}"></td><td th:text="${#temporals.format(reserva.fin, 'yyyy-MM-dd HH:mm')}"></td><td th:text="${reserva.estado}"></td><td><form th:if="${reserva.estado.name() == 'ACTIVA'}" th:action="@{/reservas/{id}/cancelar(id=${reserva.id})}" method="post"><button type="submit">Cancelar</button></form></td></tr>
<tr th:if="${#lists.isEmpty(reservas)}"><td colspan="6">Aún no hay reservas.</td></tr></tbody></table></main></body></html>
